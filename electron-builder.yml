appId: com.depositopeganabodega.app
productName: Deposito Pega na Bodega
copyright: Copyright © 2024-2026

asar: false
forceCodeSigning: false

directories:
  output: dist
  buildResources: build

files:
  - ".next/standalone/**/*"
  - ".next/static/**/*"
  - "public/**/*"
  - "electron/**/*"
  - "package.json"
  - "next.config.mjs"
  - ".env.local"

win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
  forceCodeSigning: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Deposito Pega na Bodega
  perMachine: true

extraMetadata:
  main: electron/main.js
